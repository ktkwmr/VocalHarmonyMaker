<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" type="image/svg+xml" href="/vocalharmonymaker/icons/icon.svg" />
  <title>Page not found – Vocal Harmony Maker</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #fff; color: #000;
      font-family: "Segoe UI Variable Text", "Segoe UI", "Yu Gothic UI", "Meiryo UI", system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
      -webkit-font-smoothing: antialiased; }
    main { max-width: 480px; margin: 0 auto; padding: 18vh 24px 48px; }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600; margin-bottom: 40px; }
    .brand svg { width: 28px; height: 28px; }
    .code { margin: 0; color: #000; font-size: 56px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
    h1 { margin: 16px 0 6px; font-size: 20px; }
    p { margin: 0; color: #525252; font-size: 14px; line-height: 1.7; }
    p + h1 { margin-top: 20px; }
    a.btn { display: inline-flex; align-items: center; height: 40px; margin-top: 32px; padding: 0 18px;
      border-radius: 8px; background: #000; color: #fff; font-size: 14px; font-weight: 600; text-decoration: none; }
    a.btn:focus-visible { outline: 2px solid #000; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <svg aria-hidden="true" viewBox="0 0 28 28"><rect width="28" height="28" rx="7"/><g stroke="#fff" stroke-linecap="round" fill="none"><path stroke-width="2" d="M5 20.5h3M10.5 18.5h3M16 16h2.5M21 18h2"/><path stroke-width="3" d="M5 13h3M10.5 11h3M16 8.5h2.5M21 10.5h2"/></g></svg>
      <span>Vocal Harmony Maker</span>
    </div>
    <p class="code">404</p>
    <h1>Page not found</h1>
    <p>The page you are looking for does not exist or has moved.</p>
    <h1 lang="ja">ページが見つかりません</h1>
    <p lang="ja">お探しのページは存在しないか、移動した可能性があります。</p>
    <a class="btn" href="/vocalharmonymaker/">Open Vocal Harmony Maker / アプリを開く</a>
  </main>
</body>
</html>
